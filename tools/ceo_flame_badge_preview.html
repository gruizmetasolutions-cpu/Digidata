<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🔥 Vista Previa Interactiva // Gafete CEO Inferno & Mecha Watch OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --background: #060911;
      --foreground: #f8fafc;
      --card: #0c1220;
      --border: #1e293b;
      --secondary: #1e293b;
      --secondary-foreground: #e2e8f0;
      --muted-foreground: #94a3b8;
    }
    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased p-4">
  <div class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-2xl p-4 shadow-lg max-w-4xl mx-auto">
    
    <!-- Top Bar -->
    <div class="flex flex-wrap items-center justify-between gap-2 pb-3 mb-3 border-b border-[var(--border)]">
      <div class="flex items-center gap-2">
        <span id="candleDot" class="inline-block w-3.5 h-3.5 rounded-full bg-orange-500 shadow-md"></span>
        <h2 class="text-base font-bold text-[var(--foreground)]">
          🔥 Vista Previa Interactiva // Gafete CEO Inferno & Mecha Watch OS
        </h2>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="text-[var(--muted-foreground)]">LED Trasero (Flama Vela):</span>
        <span id="candleBadge" class="px-2.5 py-0.5 rounded-md font-mono font-semibold border border-orange-500/50 bg-orange-500/15 text-amber-300">
          🕯️ FLAMA: ROJO ↔ AMARILLO
        </span>
      </div>
    </div>

    <!-- Main Content: 320x240 Simulator + Controls (Compact < 440px total height) -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
      
      <!-- Left: Physical 320x240 CYD Viewport with Live Candle Underglow -->
      <div class="md:col-span-7 flex flex-col items-center">
        <div id="cydFrame" class="p-3 rounded-2xl border-2 border-neutral-700 bg-neutral-950 transition-shadow duration-75">
          <div class="relative rounded-lg overflow-hidden border border-neutral-800 bg-black">
            <canvas id="previewCanvas" width="320" height="240" class="block cursor-pointer" style="width: 384px; height: 288px; image-rendering: pixelated;"></canvas>
          </div>
        </div>
      </div>

      <!-- Right: Interactive Mode & Flame Controls -->
      <div class="md:col-span-5 flex flex-col gap-2.5 text-xs">
        <div class="font-semibold text-[var(--muted-foreground)] uppercase tracking-wider">
          Selecciona la pantalla a previsualizar:
        </div>

        <button onclick="setMode('badge')" id="btnBadge" class="w-full px-3 py-2 rounded-xl border border-orange-500 bg-orange-500/20 text-amber-300 font-bold text-left flex items-center justify-between cursor-pointer transition">
          <span>🔥 1. Gafete CEO (Inferno + Flamas)</span>
          <span class="font-mono">ACTIVO</span>
        </button>

        <button onclick="setMode('face')" id="btnFace" class="w-full px-3 py-2 rounded-xl border border-[var(--border)] bg-[var(--background)] text-[var(--foreground)] font-semibold text-left flex items-center justify-between hover:border-orange-400 cursor-pointer transition">
          <span>👁️ 2. Rostro Mecha Agresivo</span>
          <span class="font-mono text-[var(--muted-foreground)]">VER</span>
        </button>

        <button onclick="setMode('watch')" id="btnWatch" class="w-full px-3 py-2 rounded-xl border border-[var(--border)] bg-[var(--background)] text-[var(--foreground)] font-semibold text-left flex items-center justify-between hover:border-cyan-400 cursor-pointer transition">
          <span>⌚ 3. Carátula Smartwatch OS</span>
          <span class="font-mono text-[var(--muted-foreground)]">VER</span>
        </button>

        <button onclick="setMode('boot')" id="btnBoot" class="w-full px-3 py-2 rounded-xl border border-[var(--border)] bg-[var(--background)] text-[var(--foreground)] font-semibold text-left flex items-center justify-between hover:border-amber-400 cursor-pointer transition">
          <span>🚀 4. Animación Boot Dataholics</span>
          <span class="font-mono text-[var(--muted-foreground)]">2.5s</span>
        </button>

        <!-- Flame Intensity & Attitude Controls -->
        <div class="p-3 rounded-xl bg-[var(--background)] border border-[var(--border)] mt-1 flex flex-col gap-2">
          <div class="flex justify-between items-center">
            <span class="text-[var(--muted-foreground)]">Intensidad de Flamas:</span>
            <span id="lblFlame" class="font-mono text-orange-400 font-bold">MÁXIMA (INFERNO)</span>
          </div>
          <input type="range" id="sldFlame" min="50" max="160" value="125" class="w-full accent-orange-500 cursor-pointer">

          <div class="grid grid-cols-3 gap-1.5 pt-1">
            <button onclick="setMood('soberano')" class="px-2 py-1 rounded border border-cyan-500/40 bg-cyan-500/10 text-cyan-300 font-semibold cursor-pointer">Soberano</button>
            <button onclick="setMood('soberbio')" class="px-2 py-1 rounded border border-amber-500/40 bg-amber-500/10 text-amber-300 font-semibold cursor-pointer">Soberbio</button>
            <button onclick="setMood('combate')" class="px-2 py-1 rounded border border-rose-500/40 bg-rose-500/10 text-rose-300 font-semibold cursor-pointer">Combate</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');

    let mode = 'badge'; // Starts directly on the new Inferno CEO Badge!
    let mood = 'soberano';
    let tick = 0;
    let bootProg = 0;
    let gazeX = 0, gazeY = 0, targetGX = 0, targetGY = 0;
    let blink = 0, nextBlink = 80;

    // 45 Rising Fire Particles & Embers for the CEO Badge
    const embers = Array.from({ length: 45 }, () => ({
      x: Math.random() * 320,
      y: 180 + Math.random() * 60,
      vx: (Math.random() - 0.5) * 1.2,
      vy: -(1.2 + Math.random() * 2.6),
      size: 1.5 + Math.random() * 3.5,
      life: Math.random()
    }));

    function setMode(m) {
      mode = m;
      if (m === 'boot') bootProg = 0;
      ['badge', 'face', 'watch', 'boot'].forEach(k => {
        const btn = document.getElementById('btn' + k.charAt(0).toUpperCase() + k.slice(1));
        if (k === m) {
          btn.className = "w-full px-3 py-2 rounded-xl border border-orange-500 bg-orange-500/20 text-amber-300 font-bold text-left flex items-center justify-between cursor-pointer transition";
        } else {
          btn.className = "w-full px-3 py-2 rounded-xl border border-[var(--border)] bg-[var(--background)] text-[var(--foreground)] font-semibold text-left flex items-center justify-between hover:border-orange-400 cursor-pointer transition";
        }
      });
    }

    function setMood(m) {
      mood = m;
      if (mode !== 'face') setMode('face');
    }

    canvas.addEventListener('mousemove', e => {
      const r = canvas.getBoundingClientRect();
      targetGX = ((e.clientX - r.left) / r.width - 0.5) * 1.8;
      targetGY = ((e.clientY - r.top) / r.height - 0.5) * 1.4;
    });
    canvas.addEventListener('mouseleave', () => {
      targetGX = 0; targetGY = 0;
    });
    canvas.addEventListener('click', () => {
      if (mode === 'badge') setMode('face');
      else if (mode === 'face') setMode('watch');
      else setMode('badge');
    });

    document.getElementById('sldFlame').addEventListener('input', e => {
      const v = parseInt(e.target.value, 10);
      document.getElementById('lblFlame').textContent = v > 130 ? 'OVERDRIVE 🔥' : (v > 90 ? 'MÁXIMA (INFERNO)' : 'BRASA SUAVE');
    });

    // Organic Candle-Flame RGB LED Simulation (Red=255, Green=0..165, Blue=0)
    function updateCandleLed() {
      // Multi-sine + micro-flicker noise simulating a real candle flame
      const wave = (Math.sin(tick * 0.11) * 0.35) + (Math.sin(tick * 0.27) * 0.25) + (Math.cos(tick * 0.63) * 0.20) + (Math.random() * 0.20);
      const norm = Math.max(0, Math.min(1, (wave + 0.6) / 1.4));
      const r = 255;
      const g = Math.round(15 + norm * 165); // 15 (Deep Red) -> 180 (Warm Golden Yellow)
      const colorCss = `rgb(${r}, ${g}, 0)`;

      const frame = document.getElementById('cydFrame');
      frame.style.boxShadow = `0 12px 35px rgba(0,0,0,0.85), 0 0 ${28 + norm * 26}px rgba(${r}, ${g}, 0, ${0.42 + norm * 0.28})`;
      frame.style.borderColor = `rgba(${r}, ${g}, 0, 0.75)`;

      const dot = document.getElementById('candleDot');
      dot.style.backgroundColor = colorCss;
      dot.style.boxShadow = `0 0 12px ${colorCss}`;
    }

    function drawDataholicsWings(cx, cy, scale, colWing, colCut = '#000000') {
      const wO = 11 * scale, wI = 2 * scale, hO = 5 * scale, hI = 7 * scale;
      ctx.fillStyle = colWing;
      ctx.beginPath();
      ctx.moveTo(cx - wO, cy - hO); ctx.lineTo(cx - wI, cy - hI); ctx.lineTo(cx - wI, cy + hI); ctx.lineTo(cx - wO, cy + hO);
      ctx.moveTo(cx + wI, cy - hI); ctx.lineTo(cx + wO, cy - hO); ctx.lineTo(cx + wO, cy + hO); ctx.lineTo(cx + wI, cy + hI);
      ctx.fill();

      ctx.fillStyle = colCut;
      ctx.beginPath();
      ctx.arc(cx - 6 * scale, cy, 2.8 * scale, 0, Math.PI * 2);
      ctx.arc(cx + 6 * scale, cy, 2.8 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(cx - 6 * scale, cy - scale, 12 * scale, 2 * scale);
    }

    // =========================================================================
    // FULL-SCREEN DYNAMIC INFERNO CEO BADGE (320x240)
    // =========================================================================
    function drawInfernoBadge() {
      const flameMult = parseInt(document.getElementById('sldFlame').value, 10) / 100;

      // 1. Deep Obsidian Void Background
      ctx.fillStyle = '#040508';
      ctx.fillRect(0, 0, 320, 240);

      // 2. Background Heat Grid & Sweeping Radar Laser
      ctx.strokeStyle = 'rgba(255, 80, 0, 0.12)';
      ctx.lineWidth = 1;
      for (let gx = 0; gx < 320; gx += 20) {
        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, 240); ctx.stroke();
      }
      const scanY = (tick * 2.5) % 240;
      const scanGrad = ctx.createLinearGradient(0, scanY - 12, 0, scanY + 4);
      scanGrad.addColorStop(0, 'transparent');
      scanGrad.addColorStop(1, 'rgba(255, 115, 0, 0.28)');
      ctx.fillStyle = scanGrad;
      ctx.fillRect(0, scanY - 12, 320, 16);

      // 3. Multi-Layered Procedural Roaring Flames along the Bottom & Sides!
      //    Layer A: Deep Crimson Outer Flame Tongues
      for (let x = 0; x < 320; x += 6) {
        const edgeBoost = (x < 42 || x > 278) ? 1.55 : 1.0; // Higher flames framing left & right edges!
        const n1 = Math.sin(x * 0.06 + tick * 0.18) * 14;
        const n2 = Math.cos(x * 0.13 - tick * 0.26) * 10;
        const n3 = Math.sin(x * 0.25 + tick * 0.35) * 6;
        const hCrimson = Math.max(12, (42 + n1 + n2 + n3) * flameMult * edgeBoost);
        const hOrange  = hCrimson * 0.72;
        const hGold    = hCrimson * 0.44;
        const hCore    = hCrimson * 0.22;

        // Crimson base tongue
        ctx.fillStyle = '#dc2626';
        ctx.beginPath();
        ctx.moveTo(x - 4, 240);
        ctx.lineTo(x + 3, 240 - hCrimson);
        ctx.lineTo(x + 10, 240);
        ctx.fill();

        // Dataholics Blaze Orange tongue
        ctx.fillStyle = '#ff6a00';
        ctx.beginPath();
        ctx.moveTo(x - 2, 240);
        ctx.lineTo(x + 3, 240 - hOrange);
        ctx.lineTo(x + 8, 240);
        ctx.fill();

        // Molten Amber-Gold tongue
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.moveTo(x, 240);
        ctx.lineTo(x + 3, 240 - hGold);
        ctx.lineTo(x + 6, 240);
        ctx.fill();

        // White-Hot Core
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(x + 1, 240 - hCore, 4, hCore);
      }

      // 4. Rising Glowing Embers / Fire Sparks across entire 320x240 screen
      embers.forEach(p => {
        p.x += p.vx + Math.sin(tick * 0.1 + p.y * 0.05) * 0.4;
        p.y += p.vy * flameMult;
        p.life -= 0.014;
        if (p.y < 10 || p.life <= 0) {
          p.x = Math.random() * 320;
          p.y = 225 + Math.random() * 15;
          p.life = 0.7 + Math.random() * 0.3;
        }
        ctx.fillStyle = p.life > 0.6 ? '#fef08a' : (p.life > 0.3 ? '#ff7300' : '#ef4444');
        ctx.fillRect(p.x, p.y, p.size, p.size);
      });

      // 5. Top Sovereign Header Crown
      ctx.fillStyle = 'rgba(10, 14, 23, 0.92)';
      ctx.strokeStyle = '#ff7300';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(8, 6, 304, 24, 6);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 10px monospace';
      ctx.fillText('🔥 DATAHOLICS SOVEREIGN AI // VIP CLEARANCE', 28, 21);

      // 6. Animated Flaming Dataholics Emblem + Aggressive Predator Optics (y = 38..92)
      const hoverY = Math.sin(tick * 0.08) * 2.5;
      const gx = gazeX * 8;

      // Fire aura behind center emblem
      const auraR = 26 + Math.sin(tick * 0.25) * 4;
      const grad = ctx.createRadialGradient(160, 62 + hoverY, 4, 160, 62 + hoverY, auraR);
      grad.addColorStop(0, 'rgba(255, 180, 0, 0.55)');
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(160, 62 + hoverY, auraR, 0, Math.PI * 2);
      ctx.fill();

      drawDataholicsWings(160, 62 + hoverY, 2.2, '#ff7300', '#040508');

      // Left & Right Predatory Mecha Optics flanking the emblem
      const isBlinking = (blink > 0.5);
      ctx.fillStyle = '#00f0ff';
      if (!isBlinking) {
        // Left slanted predator eye
        ctx.beginPath();
        ctx.moveTo(52 + gx, 48 + hoverY);
        ctx.lineTo(108 + gx, 58 + hoverY);
        ctx.lineTo(98 + gx, 70 + hoverY);
        ctx.lineTo(46 + gx, 60 + hoverY);
        ctx.closePath();
        ctx.fill();
        // Right slanted predator eye
        ctx.beginPath();
        ctx.moveTo(268 + gx, 48 + hoverY);
        ctx.lineTo(212 + gx, 58 + hoverY);
        ctx.lineTo(222 + gx, 70 + hoverY);
        ctx.lineTo(274 + gx, 60 + hoverY);
        ctx.closePath();
        ctx.fill();

        // Crimson/Orange vertical hunter slits inside eyes
        ctx.fillStyle = '#040508';
        ctx.fillRect(76 + gx * 1.4, 52 + hoverY, 6, 14);
        ctx.fillRect(238 + gx * 1.4, 52 + hoverY, 6, 14);
        ctx.fillStyle = '#ff7300';
        ctx.fillRect(78 + gx * 1.4, 54 + hoverY, 2, 10);
        ctx.fillRect(240 + gx * 1.4, 54 + hoverY, 2, 10);
      }
      // Heavy Flaming Brow Blades
      ctx.strokeStyle = '#ff7300';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(44 + gx, 43 + hoverY); ctx.lineTo(112 + gx, 55 + hoverY);
      ctx.moveTo(276 + gx, 43 + hoverY); ctx.lineTo(208 + gx, 55 + hoverY);
      ctx.stroke();

      // 7. Dynamic Hero Nameplate Card: ALONSO RUIZ (with sweeping molten gold shine)
      ctx.fillStyle = 'rgba(8, 11, 18, 0.88)';
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(18, 92 + hoverY * 0.5, 284, 52, 10);
      ctx.fill();
      ctx.stroke();

      // Side flame chevrons inside nameplate
      ctx.fillStyle = '#ff7300';
      ctx.fillRect(22, 98 + hoverY * 0.5, 4, 40);
      ctx.fillRect(294, 98 + hoverY * 0.5, 4, 40);

      // 3D Shadow + Main Name Text
      ctx.font = '900 30px sans-serif';
      ctx.fillStyle = '#451a03';
      ctx.fillText('ALONSO RUIZ', 46, 130 + hoverY * 0.5);

      // Animated Sweeping Fire-Gold Gradient on ALONSO RUIZ
      const shineX = ((tick * 5) % 360) - 40;
      const nameGrad = ctx.createLinearGradient(30, 100, 290, 135);
      nameGrad.addColorStop(0, '#ffffff');
      nameGrad.addColorStop(Math.max(0, Math.min(1, (shineX - 30) / 260)), '#fef08a');
      nameGrad.addColorStop(Math.max(0, Math.min(1, (shineX + 10) / 260)), '#ff7300');
      nameGrad.addColorStop(1, '#fbbf24');
      ctx.fillStyle = nameGrad;
      ctx.fillText('ALONSO RUIZ', 44, 128 + hoverY * 0.5);

      // 8. CEO Role Pill with Plasma Thrusters
      ctx.fillStyle = 'rgba(18, 10, 6, 0.92)';
      ctx.strokeStyle = '#ff7300';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(38, 152, 244, 26, 8);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#00f0ff';
      ctx.font = 'bold 11px monospace';
      ctx.fillText('⚡ CEO • CHIEF EXECUTIVE OFFICER ⚡', 48, 169);

      // 9. Bottom Obsidian Telemetry Plate floating over the flames
      ctx.fillStyle = 'rgba(5, 7, 11, 0.90)';
      ctx.strokeStyle = 'rgba(255, 115, 0, 0.7)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(24, 212, 272, 20, 5);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#fde047';
      ctx.font = 'bold 9px monospace';
      ctx.fillText('SILICON ID: 24:DC:C3:9A:45:88  •  [CLIC: CAMBIAR]', 34, 225);
    }

    // =========================================================================
    // MODE 2: AGGRESSIVE SOVEREIGN MECHA-FACE (320x240)
    // =========================================================================
    function drawMechaFace() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, 320, 240);

      let opticCol = '#00f0ff';
      if (mood === 'combate') opticCol = '#f43f5e';
      else if (mood === 'soberbio') opticCol = '#fbbf24';

      // Top Bar
      ctx.fillStyle = '#080d14';
      ctx.fillRect(0, 0, 320, 30);
      ctx.fillStyle = '#ff7300';
      ctx.fillRect(16, 2, 288, 2);
      ctx.fillStyle = '#ff7300';
      ctx.font = 'bold 10px monospace';
      ctx.fillText('RELOJ OS >', 14, 19);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 14px monospace';
      ctx.fillText('11:45', 132, 20);
      ctx.fillStyle = '#2be86b';
      ctx.font = 'bold 10px monospace';
      ctx.fillText('ACT:2 OK:15', 236, 19);

      // Forehead Crest
      drawDataholicsWings(160 + gazeX * 5, 54 + gazeY * 3, 1.3, '#ff7300', '#000000');

      // Left & Right Aggressive Mecha Optics
      [ [104, 102, true], [216, 102, false] ].forEach(([cx, cy, isL]) => {
        const x = cx + gazeX * 14, y = cy + gazeY * 8;
        const w = 84, h = 42, hw = w / 2, hh = h / 2;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(x - hw + 10, y - hh); ctx.lineTo(x + hw - 10, y - hh);
        ctx.lineTo(x + hw, y - hh + 10); ctx.lineTo(x + hw, y + hh - 10);
        ctx.lineTo(x + hw - 10, y + hh); ctx.lineTo(x - hw + 10, y + hh);
        ctx.lineTo(x - hw, y + hh - 10); ctx.lineTo(x - hw, y - hh + 10);
        ctx.closePath();
        ctx.clip();

        ctx.fillStyle = opticCol;
        ctx.fillRect(x - hw, y - hh, w, h);

        // Diamond Predator Core + Slit
        const px = x + gazeX * 8, py = y + gazeY * 5;
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.moveTo(px, py - 12); ctx.lineTo(px + 12, py); ctx.lineTo(px, py + 12); ctx.lineTo(px - 12, py);
        ctx.fill();
        ctx.fillStyle = '#ff7300';
        ctx.fillRect(px - 1.5, py - 7, 3, 14);

        // Slanted Upper Eyelid
        const ang = isL ? (mood === 'combate' ? 0.45 : 0.28) : (mood === 'soberbio' ? -0.08 : (mood === 'combate' ? -0.45 : -0.28));
        const lidDrop = blink > 0.5 ? h : (isL && mood === 'soberbio' ? 16 : 9);
        const slant = Math.sin(ang) * 34;
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.moveTo(x - w, y - h); ctx.lineTo(x + w, y - h);
        ctx.lineTo(x + hw + 4, y - hh + lidDrop + slant);
        ctx.lineTo(x - hw - 4, y - hh + lidDrop - slant);
        ctx.fill();
        ctx.restore();

        // Heavy Orange Brow Blade
        ctx.save();
        ctx.translate(cx + gazeX * 15, cy - hh - 5 + ( (!isL && mood === 'soberbio') ? -6 : 0 ));
        ctx.rotate( isL ? 0.28 : (mood === 'soberbio' ? -0.10 : -0.28) );
        ctx.fillStyle = '#ff7300';
        ctx.fillRect(-44, -3, 88, 6);
        ctx.restore();
      });

      // Steady Mecha Jawplate & 7-Slit Reactor Grille
      const jx = 160 + gazeX * 6, jy = 164 + gazeY * 4;
      ctx.strokeStyle = '#ff7300';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(jx - 78, jy - 14); ctx.lineTo(jx - 45, jy + 12);
      ctx.lineTo(jx + 45, jy + 12); ctx.lineTo(jx + 78, jy - 14);
      ctx.stroke();

      if (mood === 'soberbio') {
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(jx - 28, jy + 2); ctx.lineTo(jx + 8, jy + 2); ctx.lineTo(jx + 34, jy - 9);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#080d14';
        ctx.strokeStyle = '#293548';
        ctx.beginPath();
        ctx.roundRect(jx - 38, jy - 6, 76, 12, 3);
        ctx.fill(); ctx.stroke();
        for (let i = -3; i <= 3; i++) {
          ctx.fillStyle = Math.abs(i) <= 1 ? '#ff7300' : opticCol;
          ctx.fillRect(jx + i * 9 - 2, jy - 3, 5, 6);
        }
      }

      // Bottom Dock
      ctx.fillStyle = '#080d14';
      ctx.strokeStyle = '#fbbf24';
      ctx.beginPath(); ctx.roundRect(6, 206, 96, 28, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 9px monospace'; ctx.fillText('🔥 GAFETE CEO', 16, 224);

      ctx.fillStyle = '#080d14';
      ctx.strokeStyle = '#ff7300';
      ctx.beginPath(); ctx.roundRect(108, 206, 104, 28, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ff7300'; ctx.fillText(`MODO: ${mood.toUpperCase()}`, 118, 224);

      ctx.fillStyle = '#080d14';
      ctx.strokeStyle = '#00f0ff';
      ctx.beginPath(); ctx.roundRect(218, 206, 96, 28, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#00f0ff'; ctx.fillText('TICKETS >', 238, 224);
    }

    // =========================================================================
    // MODE 3: SMARTWATCH OS (320x240)
    // =========================================================================
    function drawSmartwatch() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, 320, 240);

      // Top Bar
      ctx.fillStyle = '#080d14';
      ctx.strokeStyle = '#293548';
      ctx.beginPath(); ctx.roundRect(6, 3, 308, 28, 8); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#00f0ff'; ctx.font = 'bold 9px monospace'; ctx.fillText('< ROSTRO MECHA', 16, 20);
      ctx.fillStyle = '#ffffff'; ctx.fillText('JUE 05 NOV', 128, 20);
      ctx.fillStyle = '#2be86b'; ctx.fillText('● WIFI ONLINE', 232, 20);

      // Center Dial
      ctx.fillStyle = '#080d14';
      ctx.strokeStyle = '#ff7300';
      ctx.beginPath(); ctx.roundRect(46, 42, 228, 150, 12); ctx.fill(); ctx.stroke();
      drawDataholicsWings(72, 68, 1.1, '#ff7300', '#080d14');

      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = ':' + String(now.getSeconds()).padStart(2, '0');
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 34px monospace'; ctx.fillText(`${hh}:${mm}`, 94, 82);
      ctx.fillStyle = '#ff7300'; ctx.font = 'bold 12px monospace'; ctx.fillText(ss, 202, 78);

      // Complication Cards
      ctx.fillStyle = '#101826'; ctx.strokeStyle = '#f43f5e';
      ctx.beginPath(); ctx.roundRect(56, 104, 100, 52, 8); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 9px monospace'; ctx.fillText('ACTIVOS', 68, 122);
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 18px monospace'; ctx.fillText('2', 68, 145);

      ctx.fillStyle = '#101826'; ctx.strokeStyle = '#2be86b';
      ctx.beginPath(); ctx.roundRect(164, 104, 100, 52, 8); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 9px monospace'; ctx.fillText('RESUELTOS', 176, 122);
      ctx.fillStyle = '#2be86b'; ctx.font = 'bold 18px monospace'; ctx.fillText('15', 176, 145);

      ctx.fillStyle = '#fbbf24'; ctx.font = '9px monospace';
      ctx.fillText('#381 Latencia en Nodo K-2SO [OPEN]', 60, 176);

      // Bottom Dock
      ctx.fillStyle = '#080d14'; ctx.strokeStyle = '#fbbf24';
      ctx.beginPath(); ctx.roundRect(108, 206, 104, 28, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 9px monospace'; ctx.fillText('🔥 GAFETE CEO', 120, 224);
    }

    // =========================================================================
    // MODE 4: DATAHOLICS EXECUTIVE BOOT (2.5s)
    // =========================================================================
    function drawBoot() {
      bootProg += 1 / 140;
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, 320, 240);
      ctx.fillStyle = '#180800';
      ctx.fillRect(0, 0, 320, 18);
      ctx.fillRect(0, 222, 320, 18);
      ctx.fillStyle = '#ff7300';
      ctx.font = 'bold 9px monospace';
      ctx.fillText('/// DATAHOLICS SOVEREIGN BIOS v4.5 // IGNITION ///', 16, 12);
      drawDataholicsWings(160, 68, 3.6, '#ff7300', '#000000');
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 16px monospace'; ctx.fillText('D A T A H O L I C S', 64, 122);
      ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 10px monospace'; ctx.fillText('* ALONSO RUIZ // CEO INFERNO EDITION *', 44, 158);

      ctx.strokeStyle = '#334155';
      ctx.strokeRect(38, 184, 244, 16);
      const segs = Math.min(16, Math.floor(bootProg * 16));
      for (let s = 0; s < segs; s++) {
        ctx.fillStyle = s >= 12 ? '#00f0ff' : '#ff7300';
        ctx.fillRect(42 + s * 15, 187, 12, 10);
      }
      if (bootProg >= 1.05) setMode('badge');
    }

    function loop() {
      tick++;
      gazeX += (targetGX - gazeX) * 0.22;
      gazeY += (targetGY - gazeY) * 0.22;
      if (tick >= nextBlink) {
        blink = 1.0;
        nextBlink = tick + 90 + Math.floor(Math.random() * 100);
      }
      blink *= 0.72;

      updateCandleLed();

      if (mode === 'badge') drawInfernoBadge();
      else if (mode === 'face') drawMechaFace();
      else if (mode === 'watch') drawSmartwatch();
      else if (mode === 'boot') drawBoot();

      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
